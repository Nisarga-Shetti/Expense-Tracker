<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Expense Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
            <header>
                <h1>Expense Tracker</h1>
                <p>Manage your money smartly</p>
            </header>

            <section class="dashboard">
                <div class="card income">
                    <h3>Total Income</h3>
                    <h2 id="total-income">₹0.00</h2>
                </div>

                <div class="card expense">
                    <h3>Total Expenses</h3>
                    <h2 id="total-expense">₹0.00</h2>
                </div>

                <div class="card balance">
                    <h3>Available Balance</h3>
                    <h2 id="balance">₹0.00</h2>
                </div>
            </section>

            <section class="transaction-form">
                <h2>Add Transaction</h2>

                <form id="transaction-form">
                    <input type="text" id="description" placeholder="Enter transaction name" required>
                    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>

                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="food">Food</option>
                        <option value="shopping">Shopping</option>
                        <option value="travel">Travel</option>
                        <option value="bills">Bills</option>
                        <option value="salary">Salary</option>
                        <option value="other">Other</option>
                    </select>

                    <select id="type" required>
                        <option value="">Select Type</option>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>

                    <input type="date" id="date" required>

                    <button type="submit">Add Transaction</button>
                </form>
            </section>

            <section class="history">
                <h2>Transaction History</h2>

                <div id="transaction-list">
                    <p>No transactions added yet.</p>
                </div>
            </section>
        </div>

        <script src="script.js"></script>
    </body>
</html>
